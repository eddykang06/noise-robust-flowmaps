# Ambient iMF on the two-armed spiral observed in 64 dimensions. `slug` is set per run on the
# command line; noise is added with an override such as
#   corruption="{name: gaussian, sigma: 1.0, clean_frac: 0.75}"
# Objective, optimizer and EMA values are the official iMF defaults
# (github.com/Lyy-iiis/imeanflow: configs/default.py, configs/train_config.yml),
# except norm_p; values marked "toy" are this repo's choices. Every budget is explicit.
seed: 42
out_root: $NRFM_OUT       # run directories; scripts/train.sbatch sets NRFM_OUT
runs_dir: runs            # <slug>.jsonl evaluation records, relative to the repo root

data:
  name: spiral            # with its 0.1 radial jitter (0.02 after scaling)
  n: 100000               # toy: fixed training-set size
  dim: 64                 # observed dimension D (src/embed.py); model.dim must match
  keep_noisy: true        # false drops corrupted samples (clean-only training)

corruption:
  name: none              # gaussian / uniform: noise of std `sigma` on all but a `clean_frac`
                          # fraction (src/corrupt.py)

model:
  name: mlp               # toy analogue of imfDiT (src/models/)
  dim: 64
  hidden: 256             # toy
  depth: 6                # toy: shared blocks = depth - aux_head_depth
  aux_head_depth: 2       # toy (iMF: 8)
  num_classes: 0          # unconditional: only the null class

objective:
  name: ambient_imf       # noisy samples train only above their noise level (src/objectives/ambient_imf.py)
  P_mean: -0.4            # official iMF (t, r) sampling
  P_std: 1.0
  data_proportion: 0.5    # share of each batch with r = t
  cfg_beta: 1.0           # omega density ~ omega^-beta (guidance only)
  class_dropout_prob: 0.1 # guidance only
  norm_p: 0.0             # plain squared error: keeps the ambient target unbiased
  norm_eps: 0.01
  guidance: false         # true: class-conditional with classifier-free guidance, as iMF
  t_margin: 0.05          # noisy samples train only at t > sigma / (1 + sigma) + t_margin

sampler:
  name: imf
  steps: [1, 2]           # each step count is evaluated
  omega: 1.0
  t_min: 0.0
  t_max: 1.0

metric:
  name: wasserstein2       # exact, by linear assignment: O(n^3) in n_samples
  n_samples: 4096

train:
  steps: 100000           # toy: synthetic-experiment budget (human, 2026-11-18; was 50k)
  batch_size: 1024
  lr: 1.0e-4
  adam_b2: 0.95
  warmup_steps: 100       # toy
  ema: 0.9999
  precision: fp32
  log_every: 1000
  eval_every: 10000
