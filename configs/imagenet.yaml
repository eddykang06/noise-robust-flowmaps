# iMF on ImageNet 256 as SD-VAE latents (src/datasets/imagenet.py), class-conditional, as in
# iMF. `slug` is set per run on the command line. Needs `python -m scripts.prepare_data
# imagenet` for the train and val splits and `... inception`. Objective and optimizer as
# configs/imf.yaml; iMF-B/2 trains for 240 epochs at batch 256 (~1.2M steps).
seed: 42
out_root: $NRFM_OUT       # run directories; scripts/train.sbatch sets NRFM_OUT
runs_dir: runs            # <slug>.jsonl evaluation records, relative to the repo root

data:
  name: imagenet
  n: null                 # all training latents (with flips); an integer takes a seeded subset
  keep_noisy: true        # false drops corrupted samples (clean-only training)

corruption:
  name: none              # gaussian / uniform: noise of std `sigma` on all but a `clean_frac`
                          # fraction (src/corrupt.py)

model:
  name: imfDiT_B_2
  input_size: 32
  in_channels: 4
  num_classes: 1000

objective:
  name: imf
  P_mean: -0.4            # logit-normal (t, r) sampling
  P_std: 1.0
  data_proportion: 0.5    # share of each batch with r = t
  cfg_beta: 1.0           # omega density ~ omega^-beta (guidance only)
  class_dropout_prob: 0.1 # guidance only
  norm_p: 0.0             # adaptive weight (loss + norm_eps)^norm_p; 0 = plain squared error,
                          # which keeps the ambient target unbiased (iMF default: 1.0)
  norm_eps: 0.01
  guidance: true          # class-conditional, trained with classifier-free guidance

sampler:
  name: imf
  steps: [1, 2]           # each step count is evaluated
  omega: 1.0              # guidance scale at sampling; 1 = conditional, no guidance
  t_min: 0.0
  t_max: 1.0
  batch: 250              # noise vectors per forward pass

metric:
  name: fid               # FID, precision/recall and Inception score on Inception features
  features: inception
  n_samples: 10000        # FID-10k against the val split during training

train:
  steps: 100000
  batch_size: 32          # one fp32 step peaks at 30 GiB (16: 15 GiB): needs a GPU of 40 GB or more
  lr: 1.0e-4
  adam_b2: 0.95
  warmup_steps: 1000
  ema: 0.9999
  precision: fp32
  log_every: 1000
  eval_every: 20000
